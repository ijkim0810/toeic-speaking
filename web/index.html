<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>TOEIC Speaking 섀도잉</title>
<link rel="manifest" href="manifest.webmanifest" />
<meta name="theme-color" content="#bfe3ff" />
<style>
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
         background: linear-gradient(160deg,#eaf6ff,#dff0ff); color:#1b2a3a;
         min-height:100dvh; }
  header { padding: 14px 16px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  select, input, button { font-size:16px; padding:8px 10px; border-radius:12px;
         border:1px solid #b9d6ee; background:#fff; }
  button.primary { background:#2f8fd6; color:#fff; border:none; }
  #stage { display:flex; flex-direction:column; align-items:center; justify-content:center;
           gap:18px; padding:24px 16px; }
  .card { width:100%; max-width:680px; border-radius:28px; padding:34px 26px;
          background:linear-gradient(160deg,#e4f2ff,#cfe8ff);
          box-shadow:0 8px 30px rgba(60,130,200,.18); position:relative; }
  .en-box { background:#fff; border-radius:20px; padding:26px 24px;
            box-shadow:0 2px 10px rgba(60,130,200,.10), inset 0 0 0 1px #dbe8f5; }
  .en { font-size:30px; font-weight:700; line-height:1.35; text-align:center; }
  .en .w { color:#93a3b5; transition:color .12s; }         /* 아직 안 읽은 단어 (흰 배경에서 잘 보이게) */
  .en .w.spoken { color:#12406e; }                         /* 이미 읽은 단어 */
  .en .w.cur { color:#0a63b8; }                            /* 현재 단어 */
  .ko { margin-top:16px; font-size:19px; text-align:center; color:#3a5a78; }
  #status { color:#4a6a88; font-size:14px; }
  .nav { display:flex; gap:14px; align-items:center; justify-content:center; }
  .nav button { min-width:104px; }
  #counter { color:#4a6a88; font-size:15px; min-width:64px; text-align:center; }
  .hidden { display:none; }
</style>
</head>
<body>
<header>
  <label>Part <select id="part"></select></label>
  <label>Task <select id="task"></select></label>
  <label>반복 <input id="repeats" type="number" min="1" max="10" value="5" style="width:60px"></label>
  <label>간격(초) <input id="gap" type="number" min="0" max="10" step="0.5" value="2" style="width:60px"></label>
  <button id="start" class="primary">▶ 시작</button>
  <button id="stop" class="hidden">■ 정지</button>
  <span id="status"></span>
</header>

<div id="stage">
  <div class="card">
    <div class="en-box"><div class="en" id="en">주제를 고르고 시작을 누르세요</div></div>
    <div class="ko" id="ko"></div>
  </div>
  <div class="nav">
    <button id="prev">◀ 이전</button>
    <span id="counter"></span>
    <button id="next">다음 ▶</button>
  </div>
</div>

<audio id="audio"></audio>

<script src="player-core.js"></script>
<script>
// player-core.js (classic script) exposes activeWordIndex as a global.
const $ = (id) => document.getElementById(id);
const audio = $("audio");
let manifest = null, sentences = [], idx = 0, running = false;
let token = 0;         // 재생 세션 식별자 (증가하면 진행 중 재생/대기가 취소됨)
let interrupt = null;  // 현재 await 중인 재생/간격을 즉시 끝내는 함수

// 반복·간격은 매번 새로 읽어 재생 중 조정이 바로 반영되게 함
const repeats = () => Math.min(10, Math.max(1, +$("repeats").value || 5));
const gapMs = () => Math.max(0, +$("gap").value || 0) * 1000;

async function load() {
  manifest = await (await fetch("manifest.json")).json();
  // Part(그룹) 목록 — 순서 유지
  const parts = [];
  manifest.topics.forEach((t) => { const g = t.group || "기타"; if (!parts.includes(g)) parts.push(g); });
  $("part").innerHTML = parts.map((g) => `<option value="${g}">${g}</option>`).join("");
  selectPart();
}

// Part 선택 → 그 Part의 Task 목록 채우기
function selectPart() {
  const g = $("part").value;
  const tasks = manifest.topics.filter((t) => (t.group || "기타") === g);
  $("task").innerHTML = tasks.map((t) => `<option value="${t.id}">${t.title}</option>`).join("");
  selectTask();
}

// Task 선택 → 문장 로드
function selectTask() {
  const t = manifest.topics.find((x) => x.id === $("task").value);
  sentences = t ? t.sentences : [];
  idx = 0; cancel(); render();
}

function renderWords(words) {
  $("en").innerHTML = words.map((w) => `<span class="w">${w.text}</span>`).join(" ");
}

function render() {
  const s = sentences[idx];
  if (!s) { $("en").textContent = "문장이 없습니다"; $("ko").textContent = ""; $("counter").textContent = ""; return; }
  renderWords(s.words);                 // 가운데는 항상 영어 (한글은 아래 .ko 에만 → 중복 제거)
  $("ko").textContent = s.ko;
  $("counter").textContent = `${idx + 1} / ${sentences.length}`;
}

function highlight(words, t) {
  const cur = activeWordIndex(words, t);
  $("en").querySelectorAll(".w").forEach((el, i) => {
    el.classList.toggle("cur", i === cur);
    // "이미 말한" 단어는 재생 시각 기준 → 단어 사이 공백에서도 유지됨
    el.classList.toggle("spoken", words[i].end <= t);
  });
}

// 오디오 1회 재생: 정상 종료 "ended", 취소 시 "interrupt" 반환
function playAudio(src, words) {
  return new Promise((resolve) => {
    audio.src = src;
    const onUpdate = () => { if (words) highlight(words, audio.currentTime); };
    const finish = (why) => {
      audio.removeEventListener("timeupdate", onUpdate);
      audio.removeEventListener("ended", onEnded);
      interrupt = null; resolve(why);
    };
    const onEnded = () => { if (words) highlight(words, 1e9); finish("ended"); };
    interrupt = () => { audio.pause(); finish("interrupt"); };
    audio.addEventListener("timeupdate", onUpdate);
    audio.addEventListener("ended", onEnded);
    audio.play();
  });
}

// 간격 대기: 정상 "ended", 취소 "interrupt"
function waitGap(ms) {
  return new Promise((resolve) => {
    if (!ms) { resolve("ended"); return; }
    const id = setTimeout(() => { interrupt = null; resolve("ended"); }, ms);
    interrupt = () => { clearTimeout(id); interrupt = null; resolve("interrupt"); };
  });
}

// 진행 중 재생/대기 취소 + 새 세션 토큰 발급
function cancel() { token++; if (interrupt) interrupt(); }

async function run(myToken) {
  while (myToken === token && idx >= 0 && idx < sentences.length) {
    const s = sentences[idx];
    render();
    $("status").textContent = "한글 뜻";
    if (await playAudio(s.koAudio, null) === "interrupt" || myToken !== token) return;
    if (await waitGap(gapMs()) === "interrupt" || myToken !== token) return;
    let i = 0;
    while (myToken === token && i < repeats()) {
      $("status").textContent = `영어 ${i + 1} / ${repeats()}`;
      if (await playAudio(s.enAudio, s.words) === "interrupt" || myToken !== token) return;
      if (await waitGap(gapMs()) === "interrupt" || myToken !== token) return;
      i++;
    }
    if (myToken !== token) return;
    idx++;
  }
  if (myToken === token) {
    running = false; idx = Math.max(0, Math.min(idx, sentences.length - 1));
    render(); $("status").textContent = "완료 ✅"; toggleButtons();
  }
}

function toggleButtons() {
  $("start").classList.toggle("hidden", running);
  $("stop").classList.toggle("hidden", !running);
}

function startPlay() {
  if (!sentences.length) return;
  running = true; toggleButtons();
  cancel(); run(token);
}
function stopPlay() {
  running = false; toggleButtons();
  cancel(); $("status").textContent = "정지됨";
}
function go(delta) {
  const n = idx + delta;
  if (n < 0 || n >= sentences.length) return;
  idx = n; cancel(); render();
  if (running) run(token);                       // 자동재생 중이면 새 문장부터 이어감
  else $("status").textContent = `${idx + 1} / ${sentences.length}`;
}

$("start").onclick = startPlay;
$("stop").onclick = stopPlay;
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("part").onchange = selectPart;
$("task").onchange = selectTask;

load();
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => navigator.serviceWorker.register("sw.js"));
  }
</script>
</body>
</html>
